<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Para mi niña bonita</title>
<link href="https://fonts.googleapis.com/css2?family=Dancing+Script:wght@600&display=swap" rel="stylesheet">
<style>
:root{--night:#0a0618;--pink:#ff5d9e;--deep:#c2185b;--blush:#ffc2dc;--green:#1f8f4e;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{height:100%;scroll-padding-top:env(safe-area-inset-top,0px)}
*{margin:0;padding:0;box-sizing:border-box}
body{height:100%;overflow:hidden;background:var(--night);
background-image:radial-gradient(ellipse at 50% 60%,#3a1250 0%,var(--night) 70%);}
.stars{position:absolute;inset:0;background-image:
radial-gradient(1.5px 1.5px at 20% 15%,#fff,transparent),radial-gradient(1px 1px at 70% 25%,#fff,transparent),
radial-gradient(1.5px 1.5px at 85% 60%,#ffd6ea,transparent),radial-gradient(1px 1px at 10% 70%,#fff,transparent),
radial-gradient(1px 1px at 45% 10%,#fff,transparent),radial-gradient(1.5px 1.5px at 60% 80%,#fff,transparent);
animation:tw 4s ease-in-out infinite alternate}
@keyframes tw{to{opacity:.4}}
.plant{position:absolute;left:50%;bottom:20vmin;width:0;height:0;transform-origin:bottom center;
animation:sway 5s ease-in-out 5s infinite}
@keyframes sway{0%,100%{transform:rotate(-1.5deg)}50%{transform:rotate(1.5deg)}}
.stem{position:absolute;bottom:0;left:-.7vmin;width:1.4vmin;height:44vmin;border-radius:1vmin;
background:linear-gradient(to top,#0d5a30,var(--green));transform-origin:bottom;animation:grow 3s ease-out backwards}
@keyframes grow{from{transform:scaleY(0)}}
.leaf{position:absolute;bottom:12vmin;width:11vmin;height:6vmin;background:linear-gradient(135deg,#2fb463,#0d5a30);
border-radius:0 100% 0 100%;animation:pop 1.2s ease-out backwards}
.leaf.l{right:.5vmin;transform-origin:right bottom;transform:scaleX(-1) rotate(-15deg);animation-delay:1.8s;--t:scaleX(-1) rotate(-15deg)}
.leaf.r{left:.5vmin;transform-origin:left bottom;transform:rotate(-15deg);bottom:22vmin;animation-delay:2.3s;--t:rotate(-15deg)}
@keyframes pop{from{transform:scale(0)}}
.head{position:absolute;left:0;bottom:44vmin;width:0;height:0;animation:rise 3s ease-out backwards}
@keyframes rise{from{bottom:0}}
.glow{position:absolute;left:-18vmin;top:-18vmin;width:36vmin;height:36vmin;border-radius:50%;
background:radial-gradient(circle,rgba(255,93,158,.55),transparent 65%);animation:glow 2s 5s ease-out backwards}
@keyframes glow{from{opacity:0;transform:scale(.2)}}
.petal{position:absolute;left:-4vmin;bottom:0;width:8vmin;height:17vmin;transform-origin:50% 100%;
border-radius:50% 50% 45% 45%/75% 75% 25% 25%;
background:linear-gradient(to top,var(--deep),var(--pink) 55%,var(--blush));
box-shadow:inset 0 0 2vmin rgba(255,255,255,.35);
transform:rotate(var(--a)) scale(var(--s));
animation:bloom 2.2s cubic-bezier(.2,.9,.3,1.2) var(--d) backwards}
@keyframes bloom{from{transform:rotate(calc(var(--a)*.15)) scale(.05);opacity:0}}
.petal.in{background:linear-gradient(to top,#8e0f45,#e8377f 60%,#ff8fbd);width:6vmin;left:-3vmin;height:13vmin}
.core{position:absolute;left:-3vmin;top:-3vmin;width:6vmin;height:6vmin;border-radius:50%;
background:radial-gradient(circle at 40% 35%,#fff3a0,#ffc400 60%,#e08600);
box-shadow:0 0 3vmin #ffc400;animation:bloom 1.5s 5.2s backwards}
.msg{position:absolute;left:0;right:0;bottom:4vmin;text-align:center;padding:0 5vw;
font-family:'Dancing Script','Segoe Script','Brush Script MT',cursive;font-weight:600;
font-size:clamp(28px,8vmin,64px);line-height:1.2;color:var(--blush);
text-shadow:0 0 12px rgba(255,93,158,.9),0 0 30px rgba(255,93,158,.5);
animation:show 3s 6s ease-out backwards}
@keyframes show{from{opacity:0;letter-spacing:.3em;filter:blur(8px)}}
.heart{position:absolute;bottom:0;color:var(--pink);pointer-events:none;animation:up linear forwards}
@keyframes up{from{transform:translateY(0) scale(.6);opacity:0}15%{opacity:.9}to{transform:translateY(-95vh) translateX(var(--x)) scale(1.1);opacity:0}}
button{position:fixed;top:calc(env(safe-area-inset-top,0px) + 12px);right:12px;z-index:9;background:rgba(255,255,255,.12);
color:#fff;border:1px solid rgba(255,255,255,.3);border-radius:20px;padding:8px 14px;font-size:14px;cursor:pointer}
#mus{right:auto;left:12px}
button:focus-visible{outline:2px solid var(--blush)}
@media(prefers-reduced-motion:reduce){.plant{animation:none}}
</style>
</head>
<body>
<div class="stars"></div>
<audio id="bg" loop>
  <source src="audio.mp3" type="audio/mpeg"><!-- pon aquí tu archivo audio.mp3 junto a este HTML -->
</audio>
<button id="mus" type="button">🎵 Reproducir música</button>
<button id="re" type="button">Ver de nuevo</button>
<div class="plant" id="plant">
  <div class="stem"></div>
  <div class="leaf l"></div><div class="leaf r"></div>
  <div class="head"><div class="glow"></div><div id="petals"></div><div class="core"></div></div>
</div>
<div class="msg">Me encantas, mi niña bonita 💗</div>
<script>
function build(){
  var box=document.getElementById('petals');box.innerHTML='';
  var layers=[{n:10,s:1,d:3.6,c:''},{n:8,s:.8,d:4.2,c:''},{n:6,s:.85,d:4.7,c:'in'}];
  layers.forEach(function(L,k){
    for(var i=0;i<L.n;i++){
      var p=document.createElement('div');p.className='petal '+L.c;
      p.style.setProperty('--a',(i*360/L.n+k*18)+'deg');
      p.style.setProperty('--s',L.s);
      p.style.setProperty('--d',(L.d+i*.08)+'s');
      box.appendChild(p);
    }
  });
}
var timer;
function hearts(){
  clearInterval(timer);
  setTimeout(function(){
    timer=setInterval(function(){
      var h=document.createElement('div');h.className='heart';h.textContent='♥';
      h.style.left=Math.random()*100+'vw';
      h.style.fontSize=(12+Math.random()*22)+'px';
      h.style.setProperty('--x',(Math.random()*60-30)+'px');
      h.style.animationDuration=(5+Math.random()*4)+'s';
      document.body.appendChild(h);
      setTimeout(function(){h.remove()},9500);
    },450);
  },5500);
}
function play(){
  var pl=document.getElementById('plant'),m=document.querySelector('.msg');
  build();
  var c=pl.cloneNode(true);pl.parentNode.replaceChild(c,pl);
  var m2=m.cloneNode(true);m.parentNode.replaceChild(m2,m);
  build();hearts();
}
var bg=document.getElementById('bg'),mus=document.getElementById('mus');
mus.addEventListener('click',function(){
  if(bg.paused){bg.play().catch(function(e){console.error(e)});}else{bg.pause();}
});
bg.addEventListener('play',function(){mus.textContent='⏸ Pausar música'});
bg.addEventListener('pause',function(){mus.textContent='🎵 Reproducir música'});
document.getElementById('re').addEventListener('click',play);
build();hearts();
</script>
</body>
</html>
